name: Build Flutter Web 
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Клонируем код
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Устанавливаем Flutter (кеш включён для ускорения)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # 3. Получаем зависимости
      - name: Install dependencies
        run: flutter pub get



      # 4. Собираем Web (результат появится в build/web)
      - name: Build Web
        run: flutter build web
      - name: Commit and Push build/web
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/web -f
          git commit -m "Auto-build: update build/web [skip ci]" || echo "No changes to commit"
          git push 
